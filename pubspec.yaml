name: poem_quiz
description: "日知 —— 古诗词与识字答题本，离线自用。"
publish_to: 'none'
version: 0.2.4+6

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: WenKai
      fonts:
        - asset: assets/fonts/wenkai_subset.ttf
