name: poem_quiz
description: "拾 —— 古诗词与识字答题本，离线自用。"
publish_to: 'none'
version: 0.5.4+17

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # 只打音效。英语与拼音朗读音频（assets/audio/en/、pinyin/）刻意不打包：
    # 它们走 OSS 按需下载（见 lib/data/speech_audio.dart），打进 APK 会让
    # 每次加词都得重新发版。这里逐个列出 wav，避免目录写法把子目录一起收进去。
    - assets/audio/correct.wav
    - assets/audio/wrong.wav
    - assets/audio/combo.wav
  fonts:
    - family: WenKai
      fonts:
        - asset: assets/fonts/wenkai_subset.ttf
