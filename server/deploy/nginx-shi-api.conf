# 拾 · 账号与云存档 API —— 反代到 127.0.0.1:8080
server {
    listen 80;
    server_name shi-api.lliyuu520.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name shi-api.lliyuu520.cn;

    ssl_certificate     /etc/nginx/ssl/_.lliyuu520.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/_.lliyuu520.cn.key;

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 512k;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    # 登录/注册按 IP 限流
    location ~ ^/api/(login|register)$ {
        limit_req zone=shi_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
